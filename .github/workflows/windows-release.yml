name: Windows release build

on:
  # Manual run from the Actions tab. You can skip the Inno installer (publish only).
  workflow_dispatch:
    inputs:
      skip_installer:
        description: 'Skip Inno Setup installer (publish app only)'
        type: boolean
        default: false
  # Automatic build + GitHub Release when you push a tag like v1.5.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required only to create a Release on tag push

jobs:
  build:
    runs-on: windows-2022   # Windows Server 2022 + VS2022 Build Tools + Windows SDK + .NET 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Build and package
        shell: powershell
        run: |
          $skip = ''
          if ('${{ github.event.inputs.skip_installer }}' -eq 'true') { $skip = '-SkipInstaller' }
          .\scripts\build-installer.ps1 $skip
      - uses: actions/upload-artifact@v4
        with:
          name: WorkPilot-Hybrid-win-x64
          path: artifacts/installer/*.exe
          if-no-files-found: error
      # ---- Optional SBOM (CycloneDX). Best-effort; never blocks the package. ----
      - name: Generate SBOM (CycloneDX)
        shell: powershell
        continue-on-error: true
        run: |
          dotnet tool install --global CycloneDX
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          dotnet CycloneDX src/WorkPilot.App/WorkPilot.App.csproj -o artifacts/sbom.xml -j `
            || Write-Warning "SBOM generation skipped"
      # ---- Optional Authenticode signing. Uncomment and add repo secrets
      #      SIGN_PFX (base64 of the .pfx) and SIGN_PASSWORD to enable. ----
      # - name: Sign installer (Authenticode)
      #   shell: powershell
      #   env:
      #     SIGN_PFX: ${{ secrets.SIGN_PFX }}
      #     SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
      #   run: |
      #     [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:SIGN_PFX))
      #     $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
      #                   Sort-Object FullName -Descending | Select-Object -First 1
      #     & $signtool.FullName sign /fd SHA256 /f cert.pfx /p "$env:SIGN_PASSWORD" artifacts/installer/*.exe
      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-Item artifacts/installer/*.exe | Select-Object -First 1
          gh release create "$env:GITHUB_REF_NAME" "$($exe.FullName)" `
            --title "WorkPilot $env:GITHUB_REF_NAME" `
            --notes "Automated Windows x64 build from $env:GITHUB_SHA."
